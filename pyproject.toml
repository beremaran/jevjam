[project]
name = "jevjam"
version = "0.3.0"
description = "Jev-compatible HTTP and MCP server for Laya and Julia decision models, with idle checkpoint unloading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "laya[serve,mcp]==0.3.20",
    "supersonic-julia",
    "torch==2.11.0",
    # Julia-1 needs transformers 5.0.x; Laya accepts it too.
    "transformers>=5.0,<5.1",
]

[project.scripts]
jevjam = "jevjam:main"

[dependency-groups]
dev = [
    "httpx>=0.27",  # starlette's TestClient transport
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

# torch comes from the CUDA 12.8 index and nowhere else. The index is explicit, so
# torch has to name it, and the Dockerfile keeps checking torch.version.cuda so a
# CPU or wrong-CUDA build fails the image rather than every request in it.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# Julia's code ships in its model repo, not on PyPI. Keep this rev equal to
# jevjam.julia.REVISION, so the code and the weights it loads match.
supersonic-julia = { git = "https://huggingface.co/SupersonicLabs/Julia-1", rev = "a85b127321d580d65176c89ced8273f305745d85" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
