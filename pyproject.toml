[project]
name = "laya-idle-serve"
version = "0.1.0"
description = "Laya's Jev-compatible HTTP server, with the checkpoints freed when it goes idle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "laya[serve,mcp]==0.3.20",
    "torch==2.11.0",
]

[project.scripts]
laya-idle-serve = "laya_idle_serve:main"

[dependency-groups]
dev = [
    "httpx>=0.27",  # starlette's TestClient transport
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

# torch comes from the CUDA 12.8 index and nowhere else. The index is explicit, so
# torch has to name it, and the Dockerfile keeps checking torch.version.cuda so a
# CPU or wrong-CUDA build fails the image rather than every request in it.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
