# Example Compose file for the jevjam HTTP API and MCP endpoint.
#
#   docker compose pull               # fetch the published image instead of building
#   docker compose up --build -d      # build if needed, start detached
#   docker compose logs -f jevjam     # follow startup and request logs
#   curl http://127.0.0.1:8000/health
#   docker compose down               # stop; the model cache survives
#
# The API and MCP endpoint share one process, one queue, and one resident model.
# See docs/configuration.md for JEVJAM_IDLE_TIMEOUT and JEVJAM_CLEF_QUANT.
#
# Each setting falls back to its old LAYA_* name, so an existing .env keeps working.
#
# Requires an NVIDIA GPU with a working driver and the NVIDIA Container
# Toolkit. See README.md to start and docs/api.md for the API reference.
services:
  jevjam:
    build: .
    image: ghcr.io/beremaran/jevjam:latest
    init: true
    restart: unless-stopped
    ports:
      # Both endpoints are published on loopback by default. JEVJAM_API_KEY protects
      # the HTTP API and MCP when set; keep this bind local or use a TLS proxy remotely.
      - "127.0.0.1:${JEVJAM_PORT:-${LAYA_PORT:-8000}}:${JEVJAM_PORT:-${LAYA_PORT:-8000}}"
    environment:
      # One value drives both the port the server binds and the published
      # host port above, so the two cannot drift apart.
      JEVJAM_PORT: "${JEVJAM_PORT:-${LAYA_PORT:-8000}}"
      # Seconds without an inference request before the checkpoints are freed.
      # 0 keeps them resident; unset uses the built-in 300.
      JEVJAM_IDLE_TIMEOUT: "${JEVJAM_IDLE_TIMEOUT:-${LAYA_IDLE_TIMEOUT:-}}"
      # How clef-flash loads: auto, bf16, 8bit, 4bit or offload; unset is auto.
      JEVJAM_CLEF_QUANT: "${JEVJAM_CLEF_QUANT:-}"
      # When set, /v1/systemone and /mcp requests need `Authorization: Bearer <key>`.
      JEVJAM_API_KEY: "${JEVJAM_API_KEY:-${LAYA_API_KEY:-}}"
      # Optional Hugging Face token for higher download rate limits.
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # Checkpoints are downloaded once and reused across recreations.
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
