# Example Compose file for the Laya HTTP API and MCP endpoint.
#
#   docker compose pull               # fetch the published image instead of building
#   docker compose up --build -d      # build if needed, start detached
#   docker compose logs -f laya       # follow startup and request logs
#   curl http://127.0.0.1:8000/health
#   docker compose down               # stop; the model cache survives
#
# The API and MCP endpoint share one process, Router, and model copy in GPU memory.
# See README.md for the LAYA_IDLE_TIMEOUT and LAYA_MAX_LOADED settings.
#
# Requires an NVIDIA GPU with a working driver and the NVIDIA Container
# Toolkit. See README.md for details and the API reference.
services:
  laya:
    build: .
    image: ghcr.io/beremaran/laya-docker:latest
    init: true
    restart: unless-stopped
    ports:
      # Both endpoints are published on loopback only. LAYA_API_KEY protects the API,
      # but not MCP, so do not expose this port to the network as-is.
      - "127.0.0.1:${LAYA_PORT:-8000}:${LAYA_PORT:-8000}"
    environment:
      # One value drives both the port the server binds and the published
      # host port above, so the two cannot drift apart.
      LAYA_PORT: "${LAYA_PORT:-8000}"
      # Seconds without an inference request before the checkpoints are freed.
      # 0 keeps them resident; unset uses the built-in 300.
      LAYA_IDLE_TIMEOUT: "${LAYA_IDLE_TIMEOUT:-}"
      # How many checkpoints may stay resident while the server is awake.
      LAYA_MAX_LOADED: "${LAYA_MAX_LOADED:-}"
      # When set, every request must send `Authorization: Bearer <key>`.
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
      # Optional Hugging Face token for higher download rate limits.
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # Checkpoints are downloaded once and reused across recreations.
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
