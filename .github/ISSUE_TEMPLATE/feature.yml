name: Feature request
description: A new model, setting, endpoint or tool
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where jevjam falls short of it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The change you have in mind, if you have one.
